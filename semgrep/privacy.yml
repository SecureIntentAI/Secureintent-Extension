rules:
  - id: no-raw-paste-egress
    mode: taint
    languages: [typescript]
    severity: ERROR
    message: >
      Raw pasted text must never be sent to SecureIntent network services or logs.
      Paste and file content may be processed by the local extension worker and
      delivered to the destination only after the user allows it. Telemetry may
      carry a salted fingerprint, never the original content.
    pattern-sources:
      - pattern: $E.clipboardData.getData(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fetch(...)
              - pattern: $X.fetch(...)
              - pattern: console.$M(...)
              - pattern: chrome.runtime.sendMessage(...)
              - pattern: browser.runtime.sendMessage(...)
